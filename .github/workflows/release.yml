name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  github-release:
    name: GitHub Release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      # A tag can point at a commit that never went through CI; the in-workflow
      # test run below covers the code, but the gate keeps an untested commit
      # from ever being the one a release is cut from.
      - name: Require green CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --workflow CI --commit "${GITHUB_SHA}" \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "${conclusion}" = "0" ]; then
            echo "::error::No successful CI run exists for ${GITHUB_SHA}; push the commit to main (or run CI manually) before tagging."
            exit 1
          fi

      - name: Swift version
        run: swift --version

      - name: Test
        run: swift test

      - name: Fetch model payloads
        run: |
          git lfs pull \
            --include "Sources/IndexEngineGloss/Resources/CoreML/JinaV5OmniSmall.bundle/**" \
            --exclude ""

      - name: Package model assets
        run: Scripts/package-model-assets.sh dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "Chartroom ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/JinaV5OmniSmall.bundle.*.zip dist/SHA256SUMS
